# Revisa los scripts de despliegue, los workflows, los archivos de Docker Compose y las pruebas e2e en cada push o
# pull request a develop/main. No levanta servicios: solo que todo sea válido.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Revisar configuración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # valores de relleno: docker compose exige que existan para validar el archivo
      DB_PASSWORD: ci-placeholder
      JWT_SECRET: ci-placeholder
      INTERNAL_API_KEY: ci-placeholder
      RABBITMQ_USERNAME: ci-placeholder
      RABBITMQ_PASSWORD: ci-placeholder
      PUBLIC_URL: https://example.org
    steps:
      - uses: actions/checkout@v4

      - name: Scripts de despliegue
        run: |
          # se revisan todos y el paso falla si falla cualquiera (con "&&" solo contaba el último)
          failed=0
          for f in deploy/*.sh; do
            if bash -n "$f"; then echo "ok $f"; else echo "::error file=$f::error de sintaxis"; failed=1; fi
          done
          shellcheck --severity=error deploy/*.sh
          exit "$failed"

      # sintaxis de los workflows, expresiones ${{ }} y, con shellcheck, los run: de cada paso
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      - name: Docker Compose (local y producción)
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app config --quiet

      - name: Pruebas e2e (sintaxis)
        run: for f in e2e/*.js; do node --check "$f"; done
