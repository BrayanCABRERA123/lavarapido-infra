# Producción (un servidor con Docker, ej. un VPS). Se suma a docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production --profile app up -d --build
#
# Diferencias con el entorno local:
# - solo Caddy publica puertos (80 y 443): base, RabbitMQ y servicios quedan en la red interna;
# - Caddy da HTTPS con el dominio (SITE_ADDRESS) y reparte: /api -> gateway, lo demás -> web;
# - sin perfil dev (Swagger apagado), SQL Server Express, llaves obligatorias, sin Mailpit;
# - cada servicio tiene límite de memoria (la JVM usa el 75 % de su límite) y se reinicia solo.
# Ver DEPLOY.md.

# el gateway reenvía la cabecera Origin del navegador a cada servicio, y cada uno revisa CORS:
# todos deben aceptar la dirección pública de la web (si no, la web recibe 403 en cada llamada)
x-public-origin: &public-origin ${PUBLIC_URL:?Set PUBLIC_URL in .env.production}

x-java-limits: &java-limits
  mem_limit: 512m
  restart: unless-stopped

# logs con tope: hasta 3 archivos de 10 MB por contenedor (sin esto crecen hasta llenar el disco)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# salud de cada servicio: GET /actuator/health tiene que decir UP. Las imágenes (Temurin y .NET)
# no traen curl ni wget, así que se pregunta con bash (/dev/tcp). Docker Compose no reinicia un
# contenedor "unhealthy": el estado se ve en docker compose ps, Portainer y update-server.sh.
x-health-timing: &health-timing
  interval: 30s
  timeout: 5s
  retries: 3
  # los servicios Java tardan 1-2 minutos en arrancar en la VM
  start_period: 150s

services:
  sqlserver:
    ports: !reset []
    environment:
      # Express es gratis para producción (Developer es solo para desarrollo)
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "1536"
    restart: unless-stopped
    logging: *logging

  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.production}
    restart: unless-stopped
    logging: *logging

  # en producción los correos salen por Gmail/Brevo: Mailpit no se levanta
  mailpit:
    profiles: ["dev-only"]

  security-service:
    <<: *java-limits
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3001 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: *public-origin
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env.production}
      # primer administrador: solo se crea si la base no tiene ninguno (la base empieza vacía)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-}

  customer-service:
    <<: *java-limits
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3002 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: *public-origin

  booking-service:
    <<: *java-limits
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3003 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: *public-origin
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env.production}

  operations-service:
    <<: *java-limits
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3004 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: *public-origin
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env.production}

  notification-service:
    <<: *java-limits
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3006 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: *public-origin
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env.production}
      # enlace del reporte de inspección que llega por correo
      WEB_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env.production}

  payment-service:
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3005 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CORS_ALLOWED_ORIGINS: *public-origin

  api-gateway:
    <<: *java-limits
    logging: *logging
    healthcheck:
      <<: *health-timing
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    ports: !reset []
    environment:
      # la web sale del mismo dominio que /api; la app del celular no usa CORS
      CORS_ALLOWED_ORIGINS: *public-origin

  # la web (Angular) servida por nginx, que pasa /api al gateway
  web:
    profiles: ["app"]
    build: ${WEB_CONTEXT:-../Front-end-proyecto-web}
    image: lavarapido/web:local
    container_name: lavarapido-web
    depends_on:
      - api-gateway
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      <<: *health-timing
      start_period: 20s
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]

  # puerta de entrada pública: HTTPS automático (Let's Encrypt) con el dominio de SITE_ADDRESS.
  # Sin dominio, SITE_ADDRESS=:80 sirve por http con la IP del servidor.
  caddy:
    profiles: ["app"]
    image: caddy:2-alpine
    container_name: lavarapido-caddy
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # APK de la app y su version.json, servidos en /app/ (los escribe deploy/publish-apk.sh)
      - ./deploy/downloads:/srv/downloads:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    # el panel interno de Caddy (solo dentro del contenedor) responde mientras el proceso funciona
    healthcheck:
      <<: *health-timing
      start_period: 20s
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]

volumes:
  caddy-data:
  caddy-config:
